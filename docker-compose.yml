version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
      - DEMO_MODE=${DEMO_MODE:-true}
      - DATABASE_URL=sqlite:///./blindspot.db
      - CORS_ORIGINS=*
    volumes:
      - ./backend/data:/app/data
      - backend-db:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-db:
